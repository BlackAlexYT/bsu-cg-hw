<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Лабораторная работа №1 · Цветовые модели</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161924'/%3E%3Ccircle cx='12' cy='12' r='8' fill='%23ff5277'/%3E%3Ccircle cx='21' cy='18' r='8' fill='%234aa8ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="lab">
        <div class="workspace">
          <aside class="preview">
            <div id="swatch">
              <span id="swatchLabel">Текущий цвет</span
              ><strong id="hexBig">#7165F5</strong>
            </div>
            <div class="hexrow">
              <label for="hex">HEX</label
              ><input
                id="hex"
                value="#7165F5"
                maxlength="7"
                spellcheck="false"
                aria-describedby="hexHint"
              /><button id="copy">Копировать</button>
            </div>
            <p id="hexHint" class="small">Шесть цифр 0–9, A–F: например, #FF8000.</p>
            <div class="palettebar">
              <label for="picker">Палитра браузера</label
              ><input type="color" id="picker" value="#7165f5" />
            </div>
            <div class="presets" id="presets" aria-label="Примеры цветов"></div>
            <div id="status" role="status" aria-live="polite"></div>
          </aside>
          <div class="models" id="models"></div>
        </div>
      </section>
    </main>
    <script src="colors.js"></script>
    <script src="app.js"></script>
  </body>
</html>
