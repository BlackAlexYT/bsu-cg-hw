<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Лабораторная работа №2 · Сегментация</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161924'/%3E%3Crect x='7' y='7' width='9' height='18' fill='%23fff'/%3E%3Crect x='16' y='7' width='9' height='18' fill='%23555b70'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1>Лабораторная работа №2</h1>
        <p>Вариант 14: локальная пороговая обработка · обнаружение точек, линий и перепадов яркости</p>
      </header>
      <div class="workspace">
        <aside class="panel side">
          <h2>Изображение</h2>
          <div class="upload" id="drop">
            <label class="filebtn"
              ><input type="file" id="file" accept="image/*" />Открыть файл…</label
            >
            <span class="small">или перетащите сюда</span>
          </div>
          <div id="gallery"></div>

          <h2>Метод</h2>
          <select id="method" aria-label="Метод обработки"></select>
          <p class="small" id="methodInfo"></p>
          <div id="params"></div>
          <div class="param">
            <div class="fieldtop">
              <label for="blur-num">Предварительное сглаживание σ</label
              ><input id="blur-num" type="number" min="0" max="5" step="0.1" value="0" />
            </div>
            <input id="blur-range" type="range" min="0" max="5" step="0.1" value="0" aria-label="σ сглаживания" />
            <p class="hint">0 — без сглаживания. Гаусс перед обработкой подавляет шум.</p>
          </div>
          <label class="check"><input type="checkbox" id="overlay" /> Наложить результат на исходное</label>
        </aside>

        <section class="panel">
          <div class="note" id="note"></div>
          <div class="views">
            <figure>
              <figcaption>Исходное (полутона)</figcaption>
              <canvas id="cvSrc"></canvas>
            </figure>
            <figure>
              <figcaption id="midCaption">Порог</figcaption>
              <canvas id="cvMid"></canvas>
            </figure>
            <figure>
              <figcaption>Результат</figcaption>
              <canvas id="cvOut"></canvas>
            </figure>
          </div>
          <div class="statusbar">
            <div id="stats"></div>
            <div id="probe" class="mono">Наведите курсор на изображение</div>
            <button id="save">Сохранить результат</button>
          </div>
          <h3 id="compareTitle">Сравнение методов</h3>
          <p class="small" id="compareHint"></p>
          <div class="compare" id="compare"></div>
        </section>
      </div>
    </main>
    <script src="imaging.js"></script>
    <script src="gallery.js"></script>
    <script src="app.js"></script>
  </body>
</html>
